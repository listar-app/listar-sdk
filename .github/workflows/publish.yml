# Publishes @listar-app/sdk to npm when a version tag is pushed:
#
#   npm version patch && git push --follow-tags
#
# Uses npm trusted publishing (GitHub OIDC): no npm token in this repository,
# and the package gets a provenance statement. One-time setup on npmjs.com:
# package settings, "Trusted Publisher", GitHub Actions, repository
# listar-app/listar-sdk, workflow publish.yml.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token npm exchanges for a publish right.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: yarn install --frozen-lockfile

      # prepublishOnly runs the typecheck, the tests and the build.
      - run: npm publish --access public --provenance
